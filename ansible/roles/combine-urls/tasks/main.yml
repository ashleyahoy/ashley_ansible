- name: Install NGINX
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Create directory for NGINX configuration
  file:
    path: /etc/nginx/conf.d
    state: directory

- name: Deploy custom NGINX configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/combine_urls.conf

- name: Deploy index.html
  template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html

- name: Deploy CSS file
  template:
    src: style.css.j2
    dest: /usr/share/nginx/html/style.css

- name: Ensure NGINX is started and enabled
  service:
    name: nginx
    state: started
    enabled: true
